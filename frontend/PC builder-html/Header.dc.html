<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newcom Header</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#F6F6F7;--surface2:#EDEDEF;--ink:#181818;--ink2:#3F3F46;--mute:#585862;--mute2:#62626C;--line:#E6E6E9;--line2:#D1D1D6;--tint:#FDECEC;--tintline:#F5B8BA;--okbg:#F0FDF4;--okfg:#166534;--badbg:#FEF2F2;--warnbg:#FFFBEB;--err:#B91C1C;--link:#C4161C;--accfg:#C4161C;--heroA:#FBD5D6;--overlay:rgba(255,255,255,.97);color-scheme:light}
:root[data-theme="dark"]{--bg:#0E0E10;--surface:#161618;--surface2:#1F1F23;--ink:#F4F4F5;--ink2:#D4D4D8;--mute:#A1A1AA;--mute2:#A1A1AA;--line:#2A2A2E;--line2:#3A3A40;--tint:#2A1214;--tintline:#6B2328;--okbg:#0E2A1B;--okfg:#86EFAC;--badbg:#32151A;--warnbg:#33260B;--err:#FCA5A5;--link:#FF6B70;--accfg:#FF8A8E;--heroA:#3A1618;--overlay:rgba(14,14,16,.97);color-scheme:dark}
body{transition:background .25s,color .25s}

body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid #E31E24;outline-offset:2px}
@keyframes mega{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sk{0%,100%{opacity:.5}50%{opacity:1}}
:root[data-theme="dark"] .lgl{display:none!important}
:root[data-theme="dark"] .lgd{display:block!important}
.mega{animation:mega .22s cubic-bezier(.2,.7,.2,1) both}
.drop{animation:drop .16s ease-out both}
.bump{animation:bump .4s cubic-bezier(.3,1.4,.5,1)}
.nv{position:relative;transition:color .2s}
.nv:hover,.nv[aria-expanded="true"]{color:var(--link)}
.ib{transition:background .2s}
.ib:hover{background:var(--surface)}
.hit{transition:background .15s}
.hit:hover{background:var(--surface)}
.sk{animation:sk 1.1s ease-in-out infinite}
@media (max-width:899px){.hdr{position:static!important}.hn{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}.hn>*{flex:none;white-space:nowrap}}
@media (prefers-reduced-motion:reduce){.mega,.drop,.bump,.sk{animation:none!important}}
</style>
</helmet>
<header class="hdr" style="position:sticky;top:{{stickyTop}};z-index:50;background:var(--bg)" onMouseLeave="{{closeMega}}">
<sc-if value="{{annOpen}}" hint-placeholder-val="{{true}}">
<div style="height:40px;background:#181818;color:var(--line);font-size:13px;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 48px;position:relative">
<span>[ANNOUNCEMENT: configured in the store admin]</span>
<button onClick="{{dismiss}}" aria-label="Dismiss announcement" style="position:absolute;right:12px;top:0;width:44px;height:40px;background:none;border:0;cursor:pointer;color:var(--line)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
</button>
</div>
</sc-if>
<div style="border-bottom:1px solid var(--line);background:var(--bg)">
<div style="max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px">
<a href="Main.dc.html" class="lg" aria-label="Newcom home" style="display:flex;align-items:center"><img class="lgl" src="./assets/aeac87b1b611033b6589a6557f713c69.png" alt="Newcom: Enrich Life Through Technology" style="display:block;height:44px;width:auto"><img class="lgd" src="./assets/89365b4a72c0c1ed78331da0ea636b79.png" alt="" aria-hidden="true" style="display:none;height:44px;width:auto"></a>
<div style="position:relative;flex:1 1 380px;min-width:0;max-width:640px">
<label for="hq" style="position:absolute;left:-9999px">Search products</label>
<svg style="position:absolute;left:16px;top:14px;color:var(--mute)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="hq" value="{{q}}" onInput="{{onQ}}" onKeyDown="{{onKey}}" placeholder="Search by product, brand, model or SKU" autocomplete="off" role="combobox" aria-expanded="{{sOpen}}" aria-controls="hres" style="width:100%;height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 16px 0 44px;font-size:15px;font-family:inherit;color:var(--ink)">
<sc-if value="{{showRes}}" hint-placeholder-val="{{false}}">
<div id="hres" role="listbox" class="drop" style="position:absolute;left:0;right:0;top:52px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(24,24,24,.22);padding:8px;z-index:60">
<sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:6px;padding:6px">
<div class="sk" style="height:48px;border-radius:8px;background:var(--surface2)"></div><div class="sk" style="height:48px;border-radius:8px;background:var(--surface2)"></div><div class="sk" style="height:48px;border-radius:8px;background:var(--surface2)"></div>
</div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding:24px 16px;text-align:center;color:var(--mute);font-size:14px">No products match “{{q}}”. Try a model number or brand.</div>
</sc-if>
<sc-for list="{{hits}}" as="h" hint-placeholder-count="4">
<a href="Product.dc.html" role="option" data-sel="{{h.selAttr}}" class="hit" style="display:flex;align-items:center;gap:14px;padding:8px;border-radius:8px;background:{{h.bg}}">
<span style="width:48px;height:48px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--mute);flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.d}}"/></svg></span>
<span style="min-width:0;flex:1"><span style="display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{h.name}}</span><span style="display:block;font-size:12px;color:var(--mute)">{{h.brand}} · {{h.sku}}</span></span>
<span style="font-size:14px;font-weight:700;white-space:nowrap">{{h.price}}</span>
</a>
</sc-for>
<sc-if value="{{hasHits}}" hint-placeholder-val="{{false}}">
<a href="Category.dc.html" style="display:block;margin-top:4px;padding:12px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--link)">See all results for “{{q}}”</a>
</sc-if>
</div>
</sc-if>
</div>
<div style="margin-left:auto;display:flex;align-items:center;gap:4px">
<button class="ib" onClick="{{notify}}" aria-label="Wishlist" style="width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg></button>
<button class="ib" onClick="{{notify}}" aria-label="Account" style="width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
<button class="ib" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)">
<sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
</button>
<a href="Cart.dc.html" class="ib" aria-label="Cart, {{cart}} items" style="position:relative;height:44px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;background:var(--tint);color:var(--accfg)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
Cart <span class="{{bumpCls}}" style="min-width:22px;height:22px;border-radius:11px;background:#E31E24;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px">{{cart}}</span>
</a>
</div>
</div>
<nav class="hn" aria-label="Categories" style="max-width:1280px;margin:0 auto;padding:0 32px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="7">
<button class="nv" onMouseEnter="{{m.open}}" onClick="{{m.open}}" onKeyDown="{{onNavKey}}" aria-expanded="{{m.exp}}" style="height:46px;padding:0 14px;border:0;background:none;font-size:14px;font-weight:{{m.fw}};cursor:pointer;display:flex;align-items:center;gap:6px">{{m.label}}</button>
</sc-for>
<a href="Builder.dc.html" class="nv" style="margin-left:auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:600;color:var(--link)">Build your PC</a>
<a href="Main.dc.html#support" class="nv" style="height:46px;display:flex;align-items:center;padding:0 14px;font-size:14px;font-weight:500;color:var(--mute)">Support</a>
</nav>
</div>
<sc-if value="{{hasPanel}}" hint-placeholder-val="{{false}}">
<div class="mega" style="position:absolute;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 24px 40px -24px rgba(24,24,24,.25)">
<div style="max-width:1280px;margin:0 auto;padding:28px 32px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px">
<sc-for list="{{panel.cols}}" as="c" hint-placeholder-count="3">
<div>
<div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:12px">{{c.title}}</div>
<div style="display:flex;flex-direction:column">
<sc-for list="{{c.links}}" as="l" hint-placeholder-count="5">
<a href="Category.dc.html" class="hit" style="font-size:14px;padding:8px 10px;margin:0 -10px;border-radius:6px;min-height:36px;display:flex;align-items:center">{{l}}</a>
</sc-for>
</div>
</div>
</sc-for>
<a href="Category.dc.html" style="grid-column:auto;min-height:150px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px">
<span style="font-size:12px;color:var(--mute)">[Category image placeholder]</span>
<span style="font-weight:700">Shop all {{panel.label}} →</span>
</a>
</div>
</div>
</sc-if>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position:fixed;left:16px;right:16px;margin:0 auto;bottom:28px;max-width:380px;background:#181818;color:#fff;border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.5;animation:toast .25s ease-out both;z-index:90">{{toast}}</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cart":{"editor":"int","default":0,"min":0,"max":99},"$preview":{"width":1440,"height":160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'light', ann: true, q: '', loading: false, results: null, sel: -1, open: -1, toast: '', bump: false };
    this.tok = 0;
  }
  componentDidMount() {
    let t = 'light';
    try {
      const saved = localStorage.getItem('newcom-theme');
      if (saved === 'dark' || saved === 'light') t = saved;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    } catch (e) {}
    this.applyTheme(t);
    this.onStore = (e) => { if (e.key === 'newcom-theme' && (e.newValue === 'dark' || e.newValue === 'light')) this.applyTheme(e.newValue); };
    window.addEventListener('storage', this.onStore);
  }
  componentWillUnmount() { window.removeEventListener('storage', this.onStore); }
  applyTheme(t) {
    try { document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    this.setState({ theme: t });
  }
  componentDidUpdate(prev) {
    if (prev.cart !== this.props.cart && !this.state.bump) {
      this.setState({ bump: true });
      setTimeout(() => this.setState({ bump: false }), 450);
    }
  }
  catalogue() {
    const cpu = 'M7 7h10v10H7zM10 10h4v4h-4zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4';
    const gpu = 'M3 8h18v8H3zM12 12a2 2 0 1 0 .01 0M3 18h6';
    const ssd = 'M4 6c0-1 3.5-2 8-2s8 1 8 2-3.5 2-8 2-8-1-8-2zM4 6v12c0 1 3.5 2 8 2s8-1 8-2V6';
    const lap = 'M4 6h16v10H4zM2 19h20';
    const mon = 'M3 4h18v12H3zM9 20h6M12 16v4';
    return [
      { name: 'ASUS Dual GeForce RTX 4060 8GB', brand: 'ASUS', sku: 'DUAL-RTX4060-O8G', price: 'LKR 139,900', d: gpu },
      { name: 'AMD Ryzen 5 7600X Processor', brand: 'AMD', sku: '100-100000593WOF', price: 'LKR 89,500', d: cpu },
      { name: 'Samsung 980 PRO 1TB NVMe SSD', brand: 'Samsung', sku: 'MZ-V8P1T0BW', price: 'LKR 46,900', d: ssd },
      { name: 'MSI Thin 15 Gaming Laptop', brand: 'MSI', sku: 'THIN-15-B12UC', price: 'LKR 329,000', d: lap },
      { name: 'Gigabyte 27in 165Hz QHD Monitor', brand: 'Gigabyte', sku: 'GS27Q', price: 'LKR 94,500', d: mon },
      { name: 'Kingston Fury Beast 16GB DDR5 5600', brand: 'Kingston', sku: 'KF556C40BB-16', price: 'LKR 24,800', d: ssd },
      { name: 'Intel Core i5-13400F Processor', brand: 'Intel', sku: 'BX8071513400F', price: 'LKR 74,900', d: cpu },
      { name: 'Corsair RM750e 750W PSU', brand: 'Corsair', sku: 'CP-9020248', price: 'LKR 58,200', d: ssd }
    ];
  }
  runSearch(q) {
    const t = ++this.tok;
    this.setState({ q, loading: q.trim().length > 0, results: null, sel: -1 });
    if (!q.trim()) return;
    setTimeout(() => {
      if (t !== this.tok) return;
      const n = q.trim().toLowerCase();
      const res = this.catalogue().filter((p) => (p.name + ' ' + p.brand + ' ' + p.sku).toLowerCase().includes(n)).slice(0, 5);
      this.setState({ loading: false, results: res });
    }, 240);
  }
  renderVals() {
    const s = this.state;
    const menus = [
      { label: 'Laptops', cols: [{ title: 'Type', links: ['Gaming laptops', 'Business laptops', 'Student laptops', 'Creator laptops'] }, { title: 'Brands', links: ['ASUS', 'MSI', 'Lenovo', 'HP'] }] },
      { label: 'Desktop PCs', cols: [{ title: 'Ready builds', links: ['Gaming PCs', 'Workstations', 'Office PCs'] }, { title: 'Custom', links: ['Build your PC', 'Request a quotation'] }] },
      { label: 'Components', cols: [{ title: 'Core', links: ['Processors', 'Graphics cards', 'Motherboards', 'Memory (RAM)'] }, { title: 'Support', links: ['SSDs and storage', 'Power supplies', 'PC cases', 'Coolers and fans'] }, { title: 'Brands', links: ['AMD', 'Intel', 'NVIDIA', 'Corsair'] }] },
      { label: 'Monitors', cols: [{ title: 'By use', links: ['Gaming monitors', 'Office monitors', 'Creator monitors'] }, { title: 'By size', links: ['24 inch', '27 inch', '32 inch and above'] }] },
      { label: 'Peripherals', cols: [{ title: 'Input', links: ['Keyboards', 'Mice', 'Controllers'] }, { title: 'Audio', links: ['Headsets', 'Speakers', 'Microphones'] }] },
      { label: 'Networking', cols: [{ title: 'Devices', links: ['Routers', 'Switches', 'Wi-Fi adapters', 'Cables'] }] },
      { label: 'Software', cols: [{ title: 'Licences', links: ['Operating systems', 'Office suites', 'Security'] }] }
    ];
    const menu = menus.map((m, i) => ({
      label: m.label,
      exp: s.open === i ? 'true' : 'false',
      fw: s.open === i ? '600' : '500',
      open: () => this.setState({ open: i })
    }));
    const cur = s.open >= 0 ? menus[s.open] : null;
    const hits = (s.results || []).map((r, i) => ({ ...r, bg: i === s.sel ? 'var(--surface)' : 'transparent', selAttr: i === s.sel ? '1' : '0' }));
    const q = s.q.trim();
    return {
      annOpen: s.ann,
      isDark: s.theme === 'dark', isLight: s.theme !== 'dark',
      themeLabel: s.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => {
        const t = s.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('newcom-theme', t); } catch (e) {}
        this.applyTheme(t);
      },
      stickyTop: s.ann ? '-40px' : '0',
      dismiss: () => this.setState({ ann: false }),
      q: s.q,
      onQ: (e) => this.runSearch(e.target.value),
      onKey: (e) => {
        const n = (s.results || []).length;
        if (e.key === 'ArrowDown' && n) { e.preventDefault(); this.setState({ sel: (s.sel + 1) % n }); }
        else if (e.key === 'ArrowUp' && n) { e.preventDefault(); this.setState({ sel: (s.sel - 1 + n) % n }); }
        else if (e.key === 'Escape') { this.runSearch(''); }
        else if (e.key === 'Enter') { try { const a = document.querySelector('a[data-sel="1"]'); if (a) a.click(); } catch (x) {} }
      },
      onNavKey: (e) => { if (e.key === 'Escape') this.setState({ open: -1 }); },
      sOpen: q ? 'true' : 'false',
      showRes: q.length > 0,
      loading: s.loading,
      empty: !s.loading && s.results && s.results.length === 0,
      hasHits: !s.loading && !!s.results && s.results.length > 0,
      hits,
      menu,
      hasPanel: !!cur,
      panel: cur ? { label: cur.label, cols: cur.cols } : { label: '', cols: [] },
      closeMega: () => { if (s.open !== -1) this.setState({ open: -1 }); },
      cart: this.props.cart ?? 0,
      bumpCls: s.bump ? 'bump' : '',
      toast: s.toast,
      notify: () => {
        this.setState({ toast: 'Accounts and wishlists need the store backend, so they are not connected in this prototype.' });
        setTimeout(() => this.setState({ toast: '' }), 3200);
      }
    };
  }
}
</script>
</body>
</html>
