# Build and test on every push and pull request; deploy to the EC2 server on every push to main.
#
# Server layout (see docs/DEPLOYMENT.md):
#   /home/ubuntu/webnewcom/backend   Go API binary "backend" on 127.0.0.1:9040 (+ .env, kept)
#   /home/ubuntu/webnewcom/frontend  Next.js "npm run start" on 127.0.0.1:9042 (+ .env.production, kept)
#   Caddy proxies api.newcom.auralflix.com -> 9040 and newcom.auralflix.com -> 9042.
#
# The server-side steps live in deploy/remote-deploy.sh (checks, staging, migration, swap, restart,
# health check and rollback). The frontend's Node.js 22 comes from webNewcom_frontend.service.
#
# Repository secrets:  SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS (recommended; optional: SSH_PORT)
# Repository variables (optional): BACKEND_SERVICE, FRONTEND_SERVICE, DEPLOY_DIR, NEXT_PUBLIC_API_URL

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.newcom.auralflix.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy scripts and the systemd drop-in
        run: |
          bash -n deploy/remote-deploy.sh deploy/install-node22.sh
          shellcheck -S warning deploy/remote-deploy.sh deploy/install-node22.sh
          # validate the drop-in exactly as systemd will merge it (stub npm so ExecStart resolves)
          sudo install -d /opt/node22/bin /etc/systemd/system/webNewcom_frontend.service.d /home/ubuntu/webnewcom/frontend
          echo '#!/bin/sh' | sudo tee /opt/node22/bin/npm >/dev/null && sudo chmod +x /opt/node22/bin/npm
          id ubuntu >/dev/null 2>&1 || sudo useradd -M ubuntu
          sudo cp deploy/systemd/webNewcom_frontend.service /etc/systemd/system/
          sudo cp deploy/systemd/webNewcom_frontend.service.d/node22.conf /etc/systemd/system/webNewcom_frontend.service.d/
          sudo systemctl daemon-reload
          sudo systemd-analyze verify webNewcom_frontend.service
          exec_start=$(systemctl show -p ExecStart --value webNewcom_frontend.service)
          env_path=$(systemctl show -p Environment --value webNewcom_frontend.service)
          echo "ExecStart: $exec_start"; echo "Environment: $env_path"
          echo "$exec_start" | grep -q '^{ path=/opt/node22/bin/npm ;'
          echo "$env_path" | grep -q 'PATH=/opt/node22/bin:/usr/bin:/usr/local/bin'

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend - vet, test, build
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go vet ./...
          go test ./...
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/backend .
          go build -trimpath -ldflags="-s -w" -o dist/migrate ./cmd/migrate
          go build -trimpath -ldflags="-s -w" -o dist/createadmin ./cmd/createadmin
          go build -trimpath -ldflags="-s -w" -o dist/seedweb ./cmd/seedweb
          cp -r migrations dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install and build
        working-directory: frontend
        env:
          # baked into the browser bundle
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          # used while pre-rendering pages here; on the server .env.production points at 127.0.0.1:9040
          NEWCOM_API_URL: ${{ env.API_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - name: Package release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release/frontend
          cp -r backend/dist release/backend
          cp -r frontend/.next frontend/public frontend/package.json frontend/package-lock.json frontend/next.config.mjs release/frontend/
          rm -rf release/frontend/.next/cache
          tar -czf release.tgz -C release .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/webnewcom' }}
      BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE || 'webNewcom.service' }}
      FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE || 'webNewcom_frontend.service' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      # checkout first: it cleans the workspace, which would delete a release downloaded before it
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions > Secrets (Repository secrets), not Variables."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set, so the server's host key is trusted on first contact. Add the secret to pin it (docs/DEPLOYMENT.md)."
            ssh-keyscan -p "$SSH_PORT" -t ed25519,ecdsa,rsa "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release
        run: scp release.tgz prod:/tmp/newcom-release.tgz

      - name: Deploy on the server (checks, migrate, swap, restart, health check, rollback)
        run: |
          ssh prod "DEPLOY_DIR='$DEPLOY_DIR' BACKEND_SERVICE='$BACKEND_SERVICE' FRONTEND_SERVICE='$FRONTEND_SERVICE' RELEASE=/tmp/newcom-release.tgz bash -s" < deploy/remote-deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
