# Drop-in for webNewcom_frontend.service: run the frontend with Node.js 22 from /opt/node22.
# Install as /etc/systemd/system/webNewcom_frontend.service.d/node22.conf; the original unit file
# is not changed and no other service is affected.
#  - the empty ExecStart= clears the original "/usr/bin/npm run start" before setting the new one
#  - PATH must start with /opt/node22/bin: npm runs "next", whose "#!/usr/bin/env node" line
#    otherwise picks up the system Node 18 from /usr/bin
# If Node 22 lives elsewhere (e.g. /opt/node-v22), change both paths below to match.
[Service]
ExecStart=
ExecStart=/opt/node22/bin/npm run start
Environment=PATH=/opt/node22/bin:/usr/bin:/usr/local/bin
