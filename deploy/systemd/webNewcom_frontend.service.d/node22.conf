# Drop-in for webNewcom_frontend.service: run the frontend with Node.js 22 from /opt/node22.
# Install to /etc/systemd/system/webNewcom_frontend.service.d/node22.conf (the original unit file
# is not changed). The empty ExecStart= clears the original command before setting the new one.
[Service]
ExecStart=
ExecStart=/opt/node22/bin/npm run start
Environment=PATH=/opt/node22/bin:/usr/bin:/usr/local/bin
